  pleiofdr_mat: /path/to/2-PleioFDR/1-MatFormat
  pleiofdr_pairs: /path/to/2-PleioFDR/2-PairedAnalysis
  pleiotropic_snps: /path/to/2-PleioFDR/3-PleiotropicSNPs/b-All
  directionality_split: /path/to/3-Directionality/1-Separate/b-All
  directionality_aggregate: /path/to/3-Directionality/2-Aggregate
  directionality_stats: /path/to/3-Directionality/3-StatisticalComparison
  fuma_pleiotropic_outputs: /path/to/4-FUMA/5-FUMAOut/a-Pleiotropic

# Example path configuration for the cardiovascular pleiotropy code archive.
# These are placeholders only. The publication repository does not include data,
# reference panels, generated results, environments, LDSC, PleioFDR, PLINK, or
# FUMA outputs.

project_dir: /path/to/cardiovascular_pleiotropies

directories:
  raw_sumstats: /path/to/raw_gwas_sumstats
  formatted_sumstats: /path/to/0-Download/2-Formatted
  liftover_sumstats: /path/to/0-Download/3-Liftover
  munged_sumstats: /path/to/0-Download/4-Munge
  filtered_sumstats: /path/to/0-Download/5-Filtered
  ldsc_heritability: /path/to/1-LDSC/1-Heritability
